services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-protube}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-protube}
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend in prod mode (same as .run/Production.run.xml) with zero local setup (no JDK/Maven/Node on the host):
  # Corretto 21 + Maven 3.9 come from the image; the `prod` Maven profile builds the frontend and bundles it.
  # Run with: docker compose up backend   → http://localhost:8080 (prod profile, PostgreSQL from `db`)
  # After changing code: docker compose restart backend
  backend:
    image: maven:3.9-amazoncorretto-21
    working_dir: /app/backend
    # `mvn` from the image instead of ./mvnw: immune to a CRLF-mangled mvnw on Windows checkouts.
    command: ["spring-boot:run", "-f", "pom.xml"]
    depends_on:
      - db
    environment:
      ENV_PROTUBE_STORE_DIR: /store
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-protube}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS:-protube}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-}
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      # Whole repo: the prod profile builds ../frontend from backend/.
      - type: bind
        source: .
        target: /app
      # Keep the container's build output apart from the host IDE's backend/target.
      - backend_target:/app/backend/target
      # Linux node_modules must not overwrite the host's (native binaries differ per OS).
      - frontend_node_modules:/app/frontend/node_modules
      # Cache downloaded dependencies between runs.
      - maven_repo:/root/.m2
      - type: bind
        source: ${ENV_PROTUBE_STORE_DIR:-./store}
        target: /store
        read_only: true

  # One-shot tool, not started by `docker compose up` (profile "tools").
  # Run with: docker compose run --rm videograbber
  videograbber:
    build: ./tooling/videoGrabber
    image: protube-videograbber
    profiles: ["tools"]
    command:
      - --store=/store
      - --id=${ENV_PROTUBE_GROUP_ID:-10}
      - --recreate
      - --videos=/videos/video_list.txt
    volumes:
      - type: bind
        source: ${ENV_PROTUBE_STORE_DIR:-./store}
        target: /store
      - type: bind
        source: ./resources
        target: /videos
        read_only: true

volumes:
  postgres_data:
  backend_target:
  frontend_node_modules:
  maven_repo:
